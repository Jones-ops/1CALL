# Local stack: Postgres, Redis, MinIO (S3), API and worker.
#   docker compose up --build
# Then run migrations + seed (see README).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: onecall
      POSTGRES_PASSWORD: onecall
      POSTGRES_DB: onecall
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onecall']
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ['6379:6379']

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/onecall-audio;
      exit 0;"

  api:
    build: .
    command: sh -c "cd apps/api && npx prisma migrate deploy && cd /app && node apps/api/src/server.js"
    env_file: [.env]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://onecall:onecall@postgres:5432/onecall
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: .
    command: node apps/worker/src/index.js
    env_file: [.env]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://onecall:onecall@postgres:5432/onecall
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
