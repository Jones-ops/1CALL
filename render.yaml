# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates a PostgreSQL database and the API (which also runs the dialer, since
# no Redis is configured). Audio recordings are kept on a persistent disk.
databases:
  - name: onecall-db
    databaseName: onecall
    user: onecall
    plan: basic-256mb # free Postgres on Render is deleted after 30 days
    region: frankfurt

services:
  - type: web
    name: onecall-api
    runtime: docker
    region: frankfurt
    plan: starter # disks and an always-on dialer need a paid instance
    dockerfilePath: ./Dockerfile
    # No quotes here: Render does not run this through a shell.
    dockerCommand: sh /app/apps/api/scripts/start.sh
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: onecall-db
          property: connectionString
      - key: MOCK_MODE
        value: 'true' # set to 'false' only when Africa's Talking and Daraja are configured
      - key: LOCAL_STORAGE_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: MEDIA_SIGNING_SECRET
        generateValue: true
      - key: VOICE_WEBHOOK_SECRET
        generateValue: true
      - key: MPESA_CALLBACK_TOKEN
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false # you are asked for this when creating the Blueprint
      - key: ADMIN_PASSWORD
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: 'false' # set to 'true' once SMTP_URL is configured (emails can't be sent before that)
      - key: SMTP_URL
        sync: false # optional; without it verification emails go to the logs
